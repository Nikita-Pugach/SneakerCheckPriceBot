name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install poetry pytest
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction

      - name: Run tests
        run: pytest -q
